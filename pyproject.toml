[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba"
version = "0.1.0"
description = "NBA database analysis for PS2 exercise 3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click", "kaggle"]

[tool.setuptools.packages.find]
include = ["nba", "nba.*"]
